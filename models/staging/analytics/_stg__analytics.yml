version: 2

models:
  - name: stg_sf1__customers
    description: One unique customer per row
    columns:
      - name: customer_id
        description: Primary Key
        tests:
          - not_null
          - unique
  - name: stg_sf1__orders
    description: One unique order per row
    columns:
      - name: order_id
        description: Primary Key
        tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc{'order_status'} }}"
        tests:
          - accepted_values:
              values: ['O', 'F', 'P']
      - name: customer_id
        tests:
          - relationships:
              to: ref('stg_sf1__customers')
              field: customer_id